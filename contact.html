<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contact – Lumen &amp; Light Photography</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div class="wrap bar">
    <a class="logo" href="index.html">Lumen <span>&amp;</span> Light</a>
    <nav id="nav">
      <a href="index.html">Home</a><a href="portfolio.html">Portfolio</a><a href="packages.html">Packages</a><a href="about.html">About</a><a href="contact.html" class="active">Contact</a>
      <button class="icon-btn" id="theme" aria-label="Toggle light or dark theme">◐</button>
    </nav>
    <button class="icon-btn menu-btn" id="menu" aria-label="Menu">☰</button>
  </div>
</header>

<main id="top">
<section id="contact" style="background:var(--surface)">
  <div class="wrap">
    <p class="eyebrow">Contact</p>
    <h2>Let's create something</h2>
    <p class="lead">Tell me about your day or project and I'll reply within 24 hours.</p>
    <form id="form" novalidate>
      <label>Name<input name="name" autocomplete="name"><span class="err"></span></label>
      <label>Email<input name="email" type="email" autocomplete="email"><span class="err"></span></label>
      <label>Session type<select name="type"><option>Wedding</option><option>Portrait</option><option>Brand</option><option>Other</option></select></label>
      <label>Message<textarea name="msg" rows="4"></textarea><span class="err"></span></label>
      <button class="btn" type="submit">Send enquiry</button>
    </form>
    <div class="ok" id="ok" hidden></div>
  </div>
</section>
</main>

<footer><div class="wrap"><span>© <span id="yr"></span> Lumen &amp; Light Photography</span><span>hello@lumenandlight.example</span></div></footer>

<script src="script.js"></script>
</body>
</html>
